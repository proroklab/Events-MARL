method: dico
seed: 0
jax_threefry_partitionable: true

env:
  scenario: football
  num_agents: 3
  max_agents: 3
  num_envs: 192
  continuous_actions: true
  penalise_by_time: false
  share_reward: false
  distance_shaping_coef: 0.0
  mixed_agent_training: false
  min_agents: 3
  use_fixed_capabilities: false
  homogeneous_capabilities: true
  fixed_capabilities:
    speed: []
    lidar_range: []
  fixed_food_positions: false
  speed_range: [0.5, 1.5]
  lidar_range_range: [0.3, 0.7]
  max_speed_range: [0.5, 1.5]
  force_multiplier_range: [0.5, 1.5]
  scenario_kwargs:
    num_red_agents: 3
    ai_red_agents: true
    ai_blue_agents: false
    physically_different: false
    enable_shooting: false
    dense_reward: true
    observe_teammates: true
    observe_adversaries: true
    disable_ai_red: false
    pos_shaping_factor_ball_goal: 10.0
    pos_shaping_factor_agent_ball: 0.1
    curriculum_stage1_episodes: 500
    curriculum_stage2_episodes: 500

model:
  policy_hidden_dims: [256, 256]
  critic_hidden_dim: 256
  critic_num_layers: 2
  use_shared_critic: true
  log_std_max: 0.0
  log_std_min: -2.0
  min_std: 0.3
  lora_rank: 8
  lora_mode: final_only
  lora_scaling_factor: 1.0
  transformer_dim: 64
  transformer_heads: 2
  transformer_layers: 2
  use_cross_agent_attention: true
  task_embed_dim: 0
  use_capability_context: false
  use_lidar_context: false
  use_positional_context: false
  positional_encoding_dim: 16
  use_onehot_context: true
  use_agent_position_context: false
  agent_position_dim: 0
  env_context: {}
  gru_hidden_dim: null
  fc_dim_size: null
  cash_hyper_hidden_dim: null
  cash_hyper_layers: null
  cash_decoder_hidden_dim: null
  cash_use_two_layer_decoder: null
  adaptive_hypernetwork: false

ppo:
  num_episodes: 2000
  rollout_steps: 300
  ppo_epochs: 3
  ppo_clip_epsilon: 0.2
  entropy_coef: 0.0
  entropy_decay: 1.0
  min_entropy_coef: 0.0
  value_loss_coef: 1.0
  gamma: 0.9
  gae_lambda: 0.9
  reward_scale: 1.0
  advantage_clip_range: 10.0
  normalize_returns: true
  clip_value_loss: false
  clip_global_state: true
  clip_global_state_min: -5.0
  clip_global_state_max: 5.0
  use_minibatches: true
  num_minibatches: 15
  shuffle_minibatches: true
  max_grad_norm: 5.0
  hypernetwork_grad_norm: 0.1
  critic_grad_norm: 5.0
  adapter_regularization_coef: 0.1

diversity:
  use_diversity_control: true
  target_snd: 0.2
  snd_moving_average_coef: 0.1
  max_diversity_scaling: 25.0
  min_snd_floor: 0.1
  num_snd_samples: 32

optimizer:
  learning_rate: 5.0e-5
  hn_learning_rate: 3.0e-5
  critic_learning_rate: 5.0e-5
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-5

evaluation:
  eval_interval: 100
  eval_start_episode: 0
  num_eval_episodes: 3
  eval_max_speeds: []
  max_eval_steps: 500
  match_training_capabilities: false

logging:
  log_dir: runs/dico_football/logs
  checkpoint_dir: runs/dico_football/checkpoints
  save_interval: 100
  experiment_name: dico_football
