method: ps
seed: 0
jax_threefry_partitionable: true
env:
  scenario: dispersion
  num_agents: 4
  max_agents: 4
  num_envs: 128
  continuous_actions: true
  penalise_by_time: true
  share_reward: false
  distance_shaping_coef: 0.0
  mixed_agent_training: false
  min_agents: 4
  use_fixed_capabilities: true
  homogeneous_capabilities: true
  fixed_capabilities:
    lidar_range:
    - 0.5
    - 0.5
    - 0.5
    - 0.5
    speed:
    - 0.5
    - 1.0
    - 1.5
    - 0.75
  fixed_food_positions: false
  speed_range:
  - 0.5
  - 1.5
  lidar_range_range:
  - 0.3
  - 0.7
  max_speed_range:
  - 0.5
  - 1.5
  force_multiplier_range:
  - 0.5
  - 1.5
  scenario_kwargs:
    fixed_n_food: 4
model:
  policy_hidden_dims:
  - 128
  - 128
  critic_hidden_dim: 128
  critic_num_layers: 2
  use_shared_critic: false
  log_std_max: 0.5
  log_std_min: -2.0
  min_std: 0.3
  lora_rank: 8
  lora_mode: final_only
  lora_scaling_factor: 1.0
  transformer_dim: 64
  transformer_heads: 2
  transformer_layers: 2
  use_cross_agent_attention: true
  task_embed_dim: 0
  use_capability_context: false
  use_lidar_context: false
  use_positional_context: true
  positional_encoding_dim: 8
  use_onehot_context: false
  use_agent_position_context: false
  agent_position_dim: 0
  env_context: {}
  gru_hidden_dim: null
  fc_dim_size: null
  cash_hyper_hidden_dim: null
  cash_hyper_layers: null
  cash_decoder_hidden_dim: null
  cash_use_two_layer_decoder: null
  adaptive_hypernetwork: true
ppo:
  num_episodes: 400
  rollout_steps: 200
  ppo_epochs: 4
  ppo_clip_epsilon: 0.2
  entropy_coef: 0.1
  entropy_decay: 1.0
  min_entropy_coef: 0.0
  value_loss_coef: 1.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_scale: 1.0
  advantage_clip_range: 10.0
  normalize_returns: false
  clip_value_loss: false
  clip_global_state: false
  clip_global_state_min: -100.0
  clip_global_state_max: 100.0
  use_minibatches: true
  num_minibatches: 8
  shuffle_minibatches: true
  max_grad_norm: 0.5
  hypernetwork_grad_norm: 0.2
  critic_grad_norm: 10.0
  adapter_regularization_coef: 0.1
optimizer:
  learning_rate: 0.0003
  hn_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-05
evaluation:
  eval_interval: 50
  eval_start_episode: 0
  num_eval_episodes: 3
  eval_max_speeds:
  - 0.5
  - 0.75
  - 1.0
  - 1.25
  - 1.5
  max_eval_steps: 200
  match_training_capabilities: false
logging:
  log_dir: runs/ps_dispersion/logs
  checkpoint_dir: runs/ps_dispersion/checkpoints
  save_interval: 100
  experiment_name: ps_dispersion
