method: ours
seed: 0
jax_threefry_partitionable: true

env:
  scenario: wind_flocking
  num_agents: 2
  max_agents: 2
  num_envs: 128
  continuous_actions: true
  penalise_by_time: false
  share_reward: false
  distance_shaping_coef: 0.1
  mixed_agent_training: false
  min_agents: 2
  use_fixed_capabilities: false
  homogeneous_capabilities: true
  fixed_capabilities:
    speed: []
    lidar_range: []
  fixed_food_positions: false
  speed_range: [0.5, 1.5]
  lidar_range_range: [0.3, 0.7]
  max_speed_range: [0.5, 1.5]
  force_multiplier_range: [0.5, 1.5]
  scenario_kwargs:
    wind: 2.0
    energy_reward_weight: 1.0
    wind_reward_weight: 1.0
    formation_shaping_weight: 0.5
    position_gain: 2.0
    max_speed: 0.5
    position_range: 5.0
    agent_radii: [0.05, 0.03]
    cover_angle_tolerance: 1.0
    horizon: 200

model:
  policy_hidden_dims: [64, 64]
  critic_hidden_dim: 64
  critic_num_layers: 2
  use_shared_critic: false
  log_std_max: 0.5
  log_std_min: -2.0
  min_std: 0.3
  lora_rank: 8
  lora_mode: final_only
  lora_scaling_factor: 1.0
  transformer_dim: 64
  transformer_heads: 2
  transformer_layers: 2
  use_cross_agent_attention: true
  task_embed_dim: 0
  target_snd_dim: 1
  use_capability_context: false
  use_lidar_context: false
  use_positional_context: false
  positional_encoding_dim: 16
  use_onehot_context: true
  use_agent_position_context: true
  agent_position_dim: 2
  env_context: {}
  gru_hidden_dim: null
  fc_dim_size: null
  cash_hyper_hidden_dim: null
  cash_hyper_layers: null
  cash_decoder_hidden_dim: null
  cash_use_two_layer_decoder: null
  adaptive_hypernetwork: false

ppo:
  num_episodes: 200
  rollout_steps: 200
  ppo_epochs: 4
  ppo_clip_epsilon: 0.2
  entropy_coef: 0.1
  entropy_decay: 1.0
  min_entropy_coef: 0.0
  value_loss_coef: 1.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_scale: 0.05
  advantage_clip_range: 10.0
  normalize_returns: false
  clip_value_loss: false
  clip_global_state: false
  clip_global_state_min: -100.0
  clip_global_state_max: 100.0
  use_minibatches: true
  num_minibatches: 8
  shuffle_minibatches: true
  max_grad_norm: 0.5
  hypernetwork_grad_norm: 0.2
  critic_grad_norm: 10.0
  adapter_regularization_coef: 0.1

diversity:
  use_diversity_control: true
  use_adapter_snd: true
  target_snd: 0.05
  snd_moving_average_coef: 0.1
  max_diversity_scaling: 10.0
  min_snd_floor: 1.0e-6
  num_snd_samples: null
  adapter_snd_sample_size: 128
  target_snd_list: [0.05, 0.1, 0.2]
  target_snd_change_interval: 50
  target_snd_mode: cycle
  target_snd_sampler: {}

optimizer:
  learning_rate: 3.0e-4
  hn_learning_rate: 3.0e-4
  critic_learning_rate: 3.0e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-5

evaluation:
  eval_interval: 50
  eval_start_episode: 0
  num_eval_episodes: 3
  eval_max_speeds: []
  max_eval_steps: 200
  match_training_capabilities: false

logging:
  log_dir: runs/ours_wind_flocking/logs
  checkpoint_dir: runs/ours_wind_flocking/checkpoints
  save_interval: 100
  experiment_name: ours_wind_flocking
